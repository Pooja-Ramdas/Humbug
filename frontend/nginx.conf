server {
    listen 80;
    server_name _;

    # Serve static frontend files
    root /usr/share/nginx/html;
    index index.html;

    # All non-file requests → index.html (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/* → backend:8000
    # Strips the /api prefix so backend sees /poles, /tickets etc.
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts generous enough for cold-start DB generation
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;

        # CORS is handled by FastAPI — don't add it here too
        proxy_pass_header Access-Control-Allow-Origin;
    }

    # Health check endpoint passthrough
    location /health {
        proxy_pass http://backend:8000/health;
    }

    # Gzip static assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;

    # Cache static assets (CSS/JS) — 1 hour, but not index.html
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
}
